[package]
name = "gribtract"
description = "High-level GRIB2 decoder — message iterator, field selection, public API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["grib2", "grib", "weather", "noaa", "decoder"]
categories = ["parser-implementations", "science", "encoding"]
readme = "README.md"

[dependencies]
gribtract-core = { workspace = true, default-features = false }
gribtract-fetch = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
gribtract-testutil.workspace = true

[features]
# Re-export jpeg2000 feature from gribtract-core for test cfg checks
jpeg2000 = ["gribtract-core/jpeg2000"]
# Enable provider probe functionality with failure tracking
provider-probe = ["gribtract-fetch/probe", "rayon"]
