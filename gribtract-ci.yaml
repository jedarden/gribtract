apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: gribtract-ci
  namespace: argo-workflows
  labels:
    app: gribtract-ci
spec:
  entrypoint: ci
  serviceAccountName: argo-workflow
  templates:
    - name: ci
      activeDeadlineSeconds: 3600
      container:
        image: debian:bookworm
        command: [bash, -c]
        args:
          - |
            set -ex

            # System dependencies
            apt-get update && apt-get install -y \
              git curl build-essential pkg-config libssl-dev

            # Install gh CLI
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh

            # Install Rust stable
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            rustup component add clippy rustfmt
            rustc --version

            # Clone from trusted hardcoded source (ignore webhook payload)
            git clone --depth 1 "https://github.com/jedarden/gribtract.git" /workspace
            cd /workspace

            COMMIT=$(git rev-parse HEAD)

            # CI checks
            cargo fmt --all -- --check
            cargo check --all-targets
            cargo clippy --all-targets -- -D warnings
            cargo test

            echo "CI passed!"

            # Run benchmark suite
            cargo run --bin xtask -- bench

            # Verify benchmark outputs exist
            if [ ! -f "bench-results.json" ]; then
              echo "bench-results.json not generated!"
              exit 1
            fi

            if [ ! -f "dashboard.html" ]; then
              echo "dashboard.html not generated!"
              exit 1
            fi

            echo "Benchmark results:"
            cat bench-results.json

            echo "Benchmark run completed successfully!"
        env:
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=x-access-token" && echo "password=$GH_TOKEN"; }; f'
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-webhook-secret
                key: token
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 1500m
            memory: 3Gi
        outputs:
          artifacts:
            - name: bench-results
              path: /workspace/bench-results.json
            - name: dashboard
              path: /workspace/dashboard.html
